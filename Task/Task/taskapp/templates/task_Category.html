<!DOCTYPE html>
<html>
<head>
    <title>Task Categories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #666;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input {
            margin-bottom: 10px;
        }
        button {
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .delete-link {
            color: red;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Task Categories</h1>

    <!-- Table of categories -->
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Parent ID</th>
            <th>Sort Order</th>
            <th>Actions</th>
        </tr>
        {% for category in categories %}
        <tr>
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>
            <td>{{ category.parent_id }}</td>
            <td>{{ category.sort_order_index }}</td>
            <td>
                <a class="delete-link" href="{% url 'delete_category' category.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <!-- Form to add a new category -->
    <h2>Add New Category</h2>
    <form method="post">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" required><br>

        <label>Parent ID:</label>
        <input type="number" name="parent_id" value="0"><br>

        <label>Sort Order Index:</label>
        <input type="number" name="sort_order_index"><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>
