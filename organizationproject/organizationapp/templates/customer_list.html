<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }
        table {
            width: 70%;
            margin: 40px auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #333;
            color: white;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Customer List</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Organization Name</th>
        <th>Website</th>
    </tr>

    {% for customer in customers %}
    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.organization_name }}</td>
        <td>
            {% if customer.website_url %}
                <a href="{{ customer.website_url }}" target="_blank">
                    Visit
                </a>
            {% else %}
                N/A
            {% endif %}
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No customers found</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
