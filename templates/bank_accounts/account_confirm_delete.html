{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 400px;">
  <div class="card border-danger">
    <div class="card-body text-center">
      <h5 class="text-danger">Delete Account?</h5>
      <p class="text-muted">Are you sure you want to delete
        <strong>{{ account.first_name }} {{ account.last_name }}</strong>?
      </p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
        <a href="{% url 'account_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
