{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 500px;">
  <h4 class="mb-4">{% if account %}Edit{% else %}Add{% endif %} Account</h4>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" name="first_name" class="form-control"
             value="{{ account.first_name|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" name="last_name" class="form-control"
             value="{{ account.last_name|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Account Number</label>
      <input type="text" name="account_number" class="form-control"
             value="{{ account.account_number|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Account Type</label>
      <select name="account_type" class="form-select">
        <option {% if account.account_type == 'Savings' %}selected{% endif %}>Savings</option>
        <option {% if account.account_type == 'Current' %}selected{% endif %}>Current</option>
        <option {% if account.account_type == 'Fixed Deposit' %}selected{% endif %}>Fixed Deposit</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">IFSC Code</label>
      <input type="text" name="ifsc_code" class="form-control"
             value="{{ account.ifsc_code|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Branch</label>
      <input type="text" name="branch" class="form-control"
             value="{{ account.branch|default:'' }}" required>
    </div>


    <!-- ✅ Bug 2 fixed — changed name="branch" to name="balance" -->
    <div class="mb-3">
      <label class="form-label">Balance</label>
      <input type="number" name="balance" step="0.01" class="form-control"
             value="{{ account.account.balance|default:'0' }}" required>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'account_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
